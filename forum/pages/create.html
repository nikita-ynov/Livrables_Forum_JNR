<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yo. - Créer un post</title>
    <link rel="icon" type="image/x-icon" href="./assets/icon.ico">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="../styles/main.css">
    <link rel="stylesheet" href="../styles/create.css">
</head>

<body>
    <aside class="sidebar" id="sidebar">
        <div class="sidebar__logo"><span class="logo-text">Y.</span></div>
        <nav class="sidebar__nav">
            <ul>
                <li title="Home"><a href="../index.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M3 9.5L12 3l9 6.5V20a1 1 0 01-1 1H4a1 1 0 01-1-1V9.5z" />
                            <path d="M9 21V12h6v9" />
                        </svg></a></li>
                <li class="active" title="New post"><a href="#" class="add-btn"><svg viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M12 5v14M5 12h14" />
                        </svg></a></li>
                <li title="Profile"><a href="./profile.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2" />
                            <circle cx="12" cy="7" r="4" />
                        </svg></a></li>
                <li title="Notifications" style="position:relative"><a href="./notifications.html"><svg
                            viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
                            stroke-linecap="round" stroke-linejoin="round">
                            <path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9" />
                            <path d="M13.73 21a2 2 0 01-3.46 0" />
                        </svg><span class="notif-dot"
                            style="position:absolute;top:8px;right:8px;width:7px;height:7px;background:#e0315a;border-radius:50%;border:2px solid var(--neutral);display:none"></span></a>
                </li>
                <li title="Admin"><a href="./admin.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                            <path
                                d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z" />
                        </svg></a></li>
            </ul>
        </nav>
        <div class="sidebar__login"><a href="./login.html" class="login-btn">Log out</a></div>
    </aside>

    <main class="container create-post">
        <header class="create-post__header">
            <h1>Créer une conversation</h1>
            <p>Partagez vos pensées avec la communauté.</p>
        </header>

        <form class="create-post__form" id="createForm">
            <div class="input-group">
                <label>TITRE DE LA CONVERSATION</label>
                <div class="search__container">
                    <input type="text" id="topicTitle" placeholder="De quoi souhaitez-vous parler ?" required>
                </div>
            </div>

            <div class="input-group">
                <label>CATÉGORIES <span style="font-size:.75rem;color:var(--secondary);font-weight:400">(plusieurs
                        possibles)</span></label>
                <div id="tagsContainer" style="display:flex;flex-wrap:wrap;gap:.4rem;padding:.5rem 0">
                    <div class="yo-spinner"></div>
                </div>
            </div>

            <div class="input-group">
                <label>VISIBILITÉ</label>
                <div class="search__container">
                    <select id="visibility" class="category-select">
                        <option value="public">Public</option>
                        <option value="private">Privé (amis uniquement)</option>
                    </select>
                </div>
            </div>

            <div class="input-group">
                <label>MESSAGE</label>
                <div class="search__container textarea-container">
                    <textarea id="topicBody" placeholder="Écrivez votre message ici..." rows="8" required></textarea>
                </div>
            </div>

            <div class="form-actions">
                <button type="button" class="ghost" onclick="history.back()">Annuler</button>
                <button type="submit" id="submitBtn">Publier la conversation</button>
            </div>
        </form>
    </main>

    <script src="../js/api.js"></script>
    <script>
        requireAuth();
        initSidebar();

        const selectedTags = new Set();

        get('/tags').then(tags => {
            const container = document.getElementById('tagsContainer');
            container.innerHTML = '';
            tags.forEach(tag => {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = 'category';
                btn.textContent = tag.name.toUpperCase();
                btn.style.cssText = 'font-size:.72rem;padding:.3rem .8rem';
                btn.onclick = () => {
                    if (selectedTags.has(tag.name)) {
                        selectedTags.delete(tag.name);
                        btn.classList.remove('active');
                    } else {
                        selectedTags.add(tag.name);
                        btn.classList.add('active');
                    }
                };
                container.appendChild(btn);
            });
        }).catch(() => {
            document.getElementById('tagsContainer').innerHTML = '<span style="color:var(--secondary);font-size:.85rem">Impossible de charger les tags</span>';
        });

        document.getElementById('createForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            if (!requireAuth()) return;
            const btn = document.getElementById('submitBtn');
            btn.disabled = true; btn.textContent = 'Publication…';
            try {
                const data = await post('/topics', {
                    user_id: Session.id(),
                    title: document.getElementById('topicTitle').value.trim(),
                    body: document.getElementById('topicBody').value.trim(),
                    tags: [...selectedTags],
                    visibility: document.getElementById('visibility').value,
                });
                toast('Topic publié !', 'success');
                setTimeout(() => window.location.href = '/pages/post.html?id=' + data.topicId, 600);
            } catch (err) {
                toast(err.message, 'error');
                btn.disabled = false; btn.textContent = 'Publier la conversation';
            }
        });
    </script>
</body>

</html>
