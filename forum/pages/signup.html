<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yo. - Sign Up</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../styles/main.css">
    <link rel="stylesheet" href="../styles/login.css">
</head>
<body>
    <main class="auth-page">
        <div class="auth-container">
            <div class="auth-header">
                <span class="logo-text">Y.</span>
                <h1>Créer un profil</h1>
                <p>Rejoignez la communauté et commencez à partager.</p>
            </div>
            <form class="auth__form" id="signupForm">
                <div class="input-group">
                    <label for="username">NOM D'UTILISATEUR</label>
                    <div class="search__container">
                        <svg class="search__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="4"></circle><path d="M16 8v5a3 3 0 006 0v-1a10 10 0 10-3.92 7.94"></path>
                        </svg>
                        <input type="text" id="username" placeholder="pseudo123" pattern="[a-zA-Z0-9]+" required>
                    </div>
                    <span class="username-hint">Uniquement lettres et chiffres</span>
                </div>
                <div class="input-group">
                    <label for="password">MOT DE PASSE</label>
                    <div class="search__container">
                        <svg class="search__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0110 0v4"></path>
                        </svg>
                        <input type="password" id="password" placeholder="••••••••" required>
                    </div>
                    <div class="password-rules">
                        <div class="password-rule" id="rule-length"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></svg>8 caractères minimum</div>
                        <div class="password-rule" id="rule-upper"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></svg>Une majuscule</div>
                        <div class="password-rule" id="rule-special"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></svg>Un caractère spécial</div>
                    </div>
                </div>
                <button type="submit" class="auth-submit-btn" id="submitBtn">Créer mon compte</button>
                <div class="auth-footer-prompt">
                    <span>Déjà inscrit ?</span>
                    <a href="./login.html">Se connecter</a>
                </div>
            </form>
        </div>
    </main>
    <script src="../js/api.js"></script>
    <script>
        if (Session.isLoggedIn()) window.location.href = '/index.html';

        const pwdInput  = document.getElementById('password');
        const checkIcon = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>`;
        const infoIcon  = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></svg>`;

        pwdInput.addEventListener('input', () => {
            const v = pwdInput.value;
            [
                { id: 'rule-length',  ok: v.length >= 8,             text: '8 caractères minimum' },
                { id: 'rule-upper',   ok: /[A-Z]/.test(v),           text: 'Une majuscule' },
                { id: 'rule-special', ok: /[^a-zA-Z0-9]/.test(v),    text: 'Un caractère spécial' },
            ].forEach(r => {
                const el = document.getElementById(r.id);
                el.classList.toggle('valid', r.ok);
                el.innerHTML = (r.ok ? checkIcon : infoIcon) + ' ' + r.text;
            });
        });

        document.getElementById('signupForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const v = pwdInput.value;
            if (v.length < 8 || !/[A-Z]/.test(v) || !/[^a-zA-Z0-9]/.test(v)) {
                toast('Votre mot de passe ne respecte pas les règles', 'error');
                return;
            }
            const btn = document.getElementById('submitBtn');
            btn.disabled = true; btn.textContent = 'Création…';
            try {
                await post('/register', {
                    username: document.getElementById('username').value.trim(),
                    password: v,
                });
                toast('Compte créé ! Connectez-vous.', 'success');
                setTimeout(() => window.location.href = '/pages/login.html', 800);
            } catch (err) {
                toast(err.message, 'error');
                btn.disabled = false; btn.textContent = 'Créer mon compte';
            }
        });
    </script>
</body>
</html>
