<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yo. - Profil utilisateur</title>
    <link rel="icon" type="image/x-icon" href="./assets/icon.ico">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="../styles/main.css">
    <link rel="stylesheet" href="../styles/home.css">
    <link rel="stylesheet" href="../styles/profile.css">
    <link rel="stylesheet" href="../styles/user.css">
</head>

<body>
    <aside class="sidebar" id="sidebar">
        <div class="sidebar__logo"><span class="logo-text">Y.</span></div>
        <nav class="sidebar__nav">
            <ul>
                <li title="Home"><a href="../index.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M3 9.5L12 3l9 6.5V20a1 1 0 01-1 1H4a1 1 0 01-1-1V9.5z" />
                            <path d="M9 21V12h6v9" />
                        </svg></a></li>
                <li title="New post"><a href="./create.html" class="add-btn"><svg viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M12 5v14M5 12h14" />
                        </svg></a></li>
                <li title="Profile"><a href="./profile.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2" />
                            <circle cx="12" cy="7" r="4" />
                        </svg></a></li>
                <li title="Notifications" style="position:relative"><a href="./notifications.html"><svg
                            viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
                            stroke-linecap="round" stroke-linejoin="round">
                            <path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9" />
                            <path d="M13.73 21a2 2 0 01-3.46 0" />
                        </svg><span class="notif-dot"></span></a></li>
                <li title="Admin"><a href="./admin.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                            <path
                                d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z" />
                        </svg></a></li>
            </ul>
        </nav>
        <div class="sidebar__login"><a href="./login.html" class="login-btn">Log out</a></div>
    </aside>

    <main class="container profile-page">
        <a href="../index.html" class="ghost back-btn"
            style="display:inline-flex;align-items:center;gap:.4rem;margin-bottom:1.5rem">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
                stroke-linejoin="round" style="width:16px;height:16px">
                <line x1="19" y1="12" x2="5" y2="12" />
                <polyline points="12 19 5 12 12 5" />
            </svg>
            Retour
        </a>
        <div id="userContainer">
            <div class="yo-spinner"></div>
        </div>
    </main>

    <script src="../js/api.js"></script>
    <script>
        initSidebar();

        const params = new URLSearchParams(location.search);
        const userId = params.get('id');
        if (!userId) window.location.href = '/index.html';

        if (Session.id() && Session.id() == userId) window.location.href = '/pages/profile.html';

        let friendshipId = null;
        let friendState = 'none';

        async function loadUser() {
            try {
                const [profile, topics] = await Promise.all([
                    get('/profile/' + userId),
                    get(`/topics?userId=${userId}&limit=all`),
                ]);

                if (Session.isLoggedIn()) {
                    const friends = await get('/friends/' + Session.id());
                    const rel = friends.find(f => f.id == userId);
                    if (rel) { friendState = rel.state; friendshipId = rel.friendship_id; }
                }

                document.title = 'Yo. - ' + profile.username;
                renderUser(profile, topics.topics.filter(t => t.user_id == userId));
            } catch { document.getElementById('userContainer').innerHTML = '<div class="yo-empty">Utilisateur introuvable.</div>'; }
        }

        function renderUser(p, topics) {
            const friendBtnHtml = Session.isLoggedIn() ? friendButtonHtml() : '';
            document.getElementById('userContainer').innerHTML = `
                <header class="profile-header">
                    <div class="profile-header__top">
                        <div class="profile-avatar-wrap">${avatar(p.avatar_url, p.username, 72)}</div>
                        <div class="profile-actions">
                            ${friendBtnHtml}
                        </div>
                    </div>
                    <div class="profile-info">
                        <h1>${escHtml(p.username)}</h1>
                        <span class="profile-handle">@${escHtml(p.username)}</span>
                        <p class="profile-bio">${escHtml(p.bio || '')}</p>
                        <div class="profile-meta-row">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                            Dernière connexion : <strong style="color:var(--primary)">${p.last_login ? timeAgo(p.last_login) : 'jamais'}</strong>
                        </div>
                        <div class="profile-stats">
                            <div class="stat"><strong>${p.topic_count}</strong><span>Topics</span></div>
                            <div class="stat"><strong>${p.message_count}</strong><span>Messages</span></div>
                            <div class="stat"><strong>${p.friend_count}</strong><span>Amis</span></div>
                        </div>
                    </div>
                </header>
                <div class="profile-tabs"><button class="tab active">Conversations</button></div>
                <div class="topic">${topics.length ? topics.map(t => `
                    <article class="topic__msg">
                        <div class="info">
                            <div class="author"><div class="avatar-wrap">${avatar(t.avatar_url, t.author, 32)}</div><div class="author__meta"><span class="author__name">${escHtml(t.author)}</span><span class="author__tag">${(t.tags[0] || 'GÉNÉRAL').toUpperCase()}</span></div></div>
                            <div class="date">${timeAgo(t.created_at).toUpperCase()}</div>
                        </div>
                        <span class="topic-status topic-status--${t.state}"><svg viewBox="0 0 10 10"><circle cx="5" cy="5" r="5"/></svg>${t.state === 'open' ? 'OUVERT' : t.state === 'closed' ? 'FERMÉ' : 'ARCHIVÉ'}</span>
                        <div class="message" onclick="window.location.href='./post.html?id=${t.id}'" style="cursor:pointer"><h2>${escHtml(t.title)}</h2><p>${escHtml((t.body || '').substring(0, 150))}…</p></div>
                    </article>`).join('') : '<div class="yo-empty">Aucun topic.</div>'}</div>`;
        }

        function friendButtonHtml() {
            if (friendState === 'accepted') return `<button class="friend-btn friends" onclick="removeFriend()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M16 11c1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3 1.34 3 3 3zm-8 0c1.66 0 3-1.34 3-3S9.66 5 8 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg>Amis</button>`;
            if (friendState === 'pending') return `<button class="friend-btn pending">Demande envoyée</button>`;
            return `<button class="friend-btn" id="addFriendBtn" onclick="addFriend()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M16 11c1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3 1.34 3 3 3zm-8 0c1.66 0 3-1.34 3-3S9.66 5 8 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg>Ajouter en ami</button>`;
        }

        async function addFriend() {
            try {
                const data = await post('/friends', { requester_id: Session.id(), receiver_id: parseInt(userId) });
                friendState = 'pending';
                friendshipId = data.friendshipId;
                document.querySelector('.profile-actions').innerHTML = friendButtonHtml();
                toast('Demande envoyée !', 'success');
            } catch (err) { toast(err.message, 'error'); }
        }

        async function removeFriend() {
            if (!confirm('Retirer cet ami ?')) return;
            try {
                await del(`/friends/${Session.id()}/${userId}`);
                friendState = 'none';
                friendshipId = null;
                document.querySelector('.profile-actions').innerHTML = friendButtonHtml();
                toast('Ami retiré', 'info');
            } catch (err) { toast(err.message, 'error'); }
        }

        function escHtml(s) { return (s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }

        loadUser();
    </script>
</body>

</html>
