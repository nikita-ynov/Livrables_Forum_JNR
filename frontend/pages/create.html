<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yo. - Créer un post</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../styles/main.css">
    <link rel="stylesheet" href="../styles/create.css">
</head>

<body>

    <aside class="sidebar" id="sidebar">
        <div class="sidebar__logo">
            <span class="logo-text">Y.</span>
        </div>
        <nav class="sidebar__nav">
            <ul>
                <li title="Home">
                    <a href="../index.html">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M3 9.5L12 3l9 6.5V20a1 1 0 01-1 1H4a1 1 0 01-1-1V9.5z" />
                            <path d="M9 21V12h6v9" />
                        </svg>
                    </a>
                </li>
                <li class="active" title="New post">
                    <a href="#" class="add-btn">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M12 5v14M5 12h14" />
                        </svg>
                    </a>
                </li>
                <li title="Profile">
                    <a href="#">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2" />
                            <circle cx="12" cy="7" r="4" />
                        </svg>
                    </a>
                </li>
            </ul>
        </nav>
        <div class="sidebar__login">
            <a href="./login.html" class="login-btn">Log in</a>
        </div>
    </aside>

    <main class="container create-post">
        <header class="create-post__header">
            <h1>Créer une conversation</h1>
            <p>Partagez vos pensées avec la communauté.</p>
        </header>

        <form class="create-post__form">
            <div class="input-group">
                <label>TITRE DE LA CONVERSATION</label>
                <div class="search__container">
                    <input type="text" placeholder="De quoi souhaitez-vous parler ?">
                </div>
            </div>

            <div class="input-group">
                <label>CATÉGORIE</label>
                <div class="search__container">
                    <select class="category-select">
                        <option value="design">DESIGN</option>
                        <option value="culture">CULTURE</option>
                        <option value="tech">TECHNOLOGIE</option>
                        <option value="mode">MODE</option>
                    </select>
                </div>
            </div>

            <div class="input-group">
                <label>MESSAGE</label>
                <div class="search__container textarea-container">
                    <textarea placeholder="Écrivez votre message ici..." rows="8"></textarea>
                </div>
            </div>

            <div class="input-group">
                <label>IMAGE (OPTIONNEL)</label>
                <label class="file-upload">
                    <input type="file" hidden>
                    <div class="file-upload__content">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                            <circle cx="8.5" cy="8.5" r="1.5"></circle>
                            <polyline points="21 15 16 10 5 21"></polyline>
                        </svg>
                        <span>Cliquez pour ajouter une image</span>
                    </div>
                </label>
            </div>

            <div class="form-actions">
                <button type="button" class="ghost" onclick="history.back()">Annuler</button>
                <button type="submit">Publier la conversation</button>
            </div>
        </form>
    </main>

</body>

</html>
