<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yo. - Sign Up</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../styles/main.css">
    <link rel="stylesheet" href="../styles/login.css">
</head>

<body>

    <main class="auth-page">
        <div class="auth-container">
            <div class="auth-header">
                <span class="logo-text">Y.</span>
                <h1>Créer un profil</h1>
                <p>Rejoignez la communauté et commencez à partager.</p>
            </div>

            <form class="auth__form" action="POST">
                <div class="input-group">
                    <label for="fullname">NOM COMPLET</label>
                    <div class="search__container">
                        <svg class="search__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2" />
                            <circle cx="12" cy="7" r="4" />
                        </svg>
                        <input type="text" id="fullname" placeholder="John Doe" required>
                    </div>
                </div>

                <div class="input-group">
                    <label for="username">IDENTIFIANT</label>
                    <div class="search__container">
                        <svg class="search__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="4"></circle>
                            <path d="M16 8v5a3 3 0 006 0v-1a10 10 0 10-3.92 7.94"></path>
                        </svg>
                        <input type="text" id="username" placeholder="votre_pseudo" required>
                    </div>
                </div>

                <!-- <div class="input-group">
                    <label for="email">EMAIL</label>
                    <div class="search__container">
                        <svg class="search__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                            <polyline points="22,6 12,13 2,6"></polyline>
                        </svg>
                        <input type="email" id="email" placeholder="email@exemple.com" required>
                    </div>
                </div> -->

                <div class="input-group">
                    <label for="password">MOT DE PASSE</label>
                    <div class="search__container">
                        <svg class="search__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                            <path d="M7 11V7a5 5 0 0110 0v4"></path>
                        </svg>
                        <input type="password" id="password" placeholder="••••••••" required>
                    </div>
                </div>

                <button type="submit" class="auth-submit-btn">Créer mon compte</button>

                <div class="auth-footer-prompt">
                    <span>Déjà inscrit ?</span>
                    <a href="./login.html">Se connecter</a>
                </div>
            </form>
        </div>
    </main>

</body>

</html>
